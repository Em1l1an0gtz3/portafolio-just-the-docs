<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pac-Man Shooter 2D</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="game">
  <h1>🟡 PAC-MAN SHOOTER 2D</h1>
  <div class="hud">
    <span>Puntos: <b id="score">0</b></span>
    <span>Vidas: <b id="lives">3</b></span>
    <span>Nivel: <b id="level">1</b></span>
  </div>
  <canvas id="game" width="900" height="600"></canvas>
  <div class="help">WASD/Flechas: mover · Mouse: apuntar · Click/Espacio: disparar · P: pausa</div>
  <button id="restart">Reiniciar</button>
</main>
<script src="script.js"></script>
</body>
</html>
